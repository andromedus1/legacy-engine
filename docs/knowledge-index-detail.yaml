  docs/briefs/ingestion-archetype-contracts/mtgoformatdata-rule-schema.md:
    summary: 'Documents the rule-as-data schema of Badaro/MTGOFormatData for Legacy:
      an archetype is a JSON file

      with a `Name`, an `IncludeColorInName` flag, a `Conditions` array (AND-combined),
      and optional ordered

      `Variants` (sub-archetypes that require the parent to match first). Twelve condition
      `Type` values cover

      presence/absence in main/side/either at 1+ and 2+ thresholds. Fallbacks are
      `CommonCards`-similarity

      "piles" used only when no archetype matches (≥10% overlap floor). Color/guild
      naming is NOT in this

      repo — it is computed by the consumer (MTGOArchetypeParser) from the manabase,
      with this repo supplying

      only `color_overrides.json` (land/non-land color hints) and the per-rule `IncludeColorInName`
      toggle.

      Legacy has ~174 archetype files + 8 fallbacks; the taxonomy matches the community
      tier list. Updated

      roughly monthly; last Legacy commit 2026-05-18.

      '
    key_findings:
    - 'A rule = JSON object: `Name` (string), `IncludeColorInName` (bool), `Conditions`
      (array, ALL must pass = logical AND), optional `Variants` (ordered array of
      sub-rules). One archetype per file under `Formats/Legacy/Archetypes/`.'
    - 'Twelve condition `Type` values: `InMainboard`/`InSideboard`/`InMainOrSideboard`
      (any one of `Cards` present), the `OneOrMore*` and `TwoOrMore*` count-threshold
      trio for each zone, and `DoesNotContain`/`DoesNotContainMainboard`/`DoesNotContainSideboard`
      (exclusion). Within a condition the `Cards` array is OR/any-of; across conditions
      it is AND.'
    - Variants require the parent archetype to match FIRST, then the variant's own
      conditions; they are evaluated in array order and refine the label (e.g. Delver
      → Temur Delver / Tempo). `DoesNotContain` is the standard tool to make sibling
      archetypes mutually exclusive (Delver excludes Entomb/Doomsday/Hogaak/Grief;
      Show and Tell excludes Doomsday/Aluren/Reanimate/Hive Mind).
    - 'Fallbacks (`Formats/Legacy/Fallbacks/`, 8 files: Aggro, Control, Cradle, Dredge,
      GenericZoo, Midrange, Patchwork, Stompy) have `Name` + `IncludeColorInName`
      + `CommonCards` (no Conditions). Used only when no archetype matched; the deck
      is assigned to the highest-overlap fallback, requiring ≥10% card overlap, else
      unclassified.'
    - Color/guild naming is the CONSUMER'S job, NOT in this repo. MTGOFormatData supplies
      only the per-rule `IncludeColorInName` boolean and `Formats/Legacy/color_overrides.json`
      ({`Lands`,`NonLands`} each a list of {`Name`,`Color`} where Color is a WUBRG-letter
      string). The parser computes deck colors from the manabase + overrides, then
      prefixes the guild name (UB→Dimir) when the flag is true.
    - Legacy coverage ≈ 174 archetype files; taxonomy matches the community tier list
      — Delver (with Tempo variant), Show and Tell, Lands, Reanimator, Oops! All Spells,
      Doomsday, Eldrazi, D&T, ANT/TES/RubyStorm, Painter, Depths, etc. are all present
      as named files.
    - '`metas.json` defines ~40 named format eras (StartDate yyyy-mm-dd + Name; latest
      `PostFrogBan` 2024-12-16) — rules are time-versioned by era, so a consumer must
      pick the era matching each event''s date. Maintenance is monthly-ish; last Legacy
      commit `Mid May 2026 Formats update (#152)` on 2026-05-18.'
    - Track upstream by pinning a commit SHA of `master` and diffing `Formats/Legacy/`
      between SHAs; commits are tagged `[Legacy] ...` (mostly 'conflict' fixes) so
      the Legacy-relevant delta is greppable from the log.
