  docs/briefs/ingestion-archetype-contracts/scryfall-card-contract.md:
    summary: |
      The card-data contract. Deck colors come from intersecting lands' produced_mana with nonlands' colors
      (never color_identity). Specifies a multi-key name index (split/DFC/adventure), the oracle_cards bulk
      choice, how Legacy tags derive from Scryfall fields, and a Card Pydantic model. Reuse verdict: extend
      edh-engine's scryfall.py, don't fork.
    key_findings:
      - "Color naming = INTERSECTION of lands' colors and nonlands' colors (GetColors); NOT Scryfall colors, NOT color_identity."
      - "Map to Scryfall: lands → produced_mana (minus C); nonlands → colors. color_identity would mis-name decks."
      - "Name resolution: index full name + each face name; split/adventure use ' // '; DFC put per-face colors on card_faces[]."
      - "Bulk file = oracle_cards (~173 MB, ~daily); bulk has no rate limit; REST ≤10/s with UA+Accept headers."
      - "Legality should use a version-stamped blacklist, not Scryfall's legacy flag (which lags B&R)."
      - "REUSE VERDICT: EXTEND, don't fork — index the FULL oracle pool (Legacy ≫ cEDH's 3,148 cards), add a Card model + colors-of-deck helper."
      - "staple_role / is_free_spell / mana-base tags are derived (oracle-text/type_line patterns), not native to Scryfall."
    related:
