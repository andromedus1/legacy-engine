  docs/briefs/legacy-metagame.md:
    summary: |
      The core domain brief for legacy-engine. Maps the 2026 Legacy metagame: four-pillar tier structure
      (no Tier 0), per-archetype game plans and goldfish clocks, the data-source ecosystem (the edhtop16
      analog), and how to attack the field (matchup matrix, hosers-by-target, sideboard strategy, what-to-play).
