  docs/briefs/ingestion-archetype-contracts/scryfall-card-contract.md:
    summary: 'The CARD-DATA CONTRACT for legacy-engine''s archetype classifier. Pins
      down which Scryfall

      fields feed deck-color naming (the surprise: MTGOArchetypeParser does NOT use
      Scryfall colors

      OR color_identity — it intersects hand-curated land-colors with nonland-card-colors,
      which map

      to Scryfall produced_mana for lands and colors for nonlands, never color_identity).
      Specifies a

      multi-key name index that handles split / DFC / adventure cards, the Scryfall
      bulk-data choice

      (oracle_cards) and access rules, how the Legacy-specific staple_role / is_free_spell
      / mana-base

      tags derive from Scryfall fields, and a Card Pydantic model in the edh-engine
      idiom. Verdict on

      reuse: extend, don''t fork.

      '
    key_findings:
    - MTGOArchetypeParser color naming = INTERSECTION of (colors present in the deck's
      LANDS) and (colors present in the deck's NONLAND cards); a color is in the deck's
      name only if it appears in BOTH sets (ArchetypeAnalyzer.GetColors, lines 120-124).
      This is NOT Scryfall colors and NOT color_identity.
    - 'Map to Scryfall: land color contribution -> `produced_mana` (Underground Sea:
      colors=[], produced_mana=[B,U]); nonland color contribution -> `colors` (the
      mana-cost colors). NEVER color_identity — it folds in rules-text/hybrid symbols
      and would mis-name decks (e.g. a deck splashing a card with off-color text symbols).'
    - 'Badaro derives those colors from a hand-curated card_colors.json (auto-generated
      from MTGJSON, split into `Lands` and `NonLands`) plus color_overrides.json —
      NOT from Scryfall. The Python port can replace that file with a Scryfall-derived
      computation: lands=produced_mana minus {C}, nonlands=colors. RULES sibling owns
      the rule Cards arrays; this brief owns name->card+colors resolution.'
    - 'Name resolution: index by full name AND each face name; split/adventure use
      '' // '' joined names and top-level `colors`/`mana_cost`; DFC/MDFC put per-face
      `colors`/`mana_cost` on card_faces[] with top-level mana_cost null. Reuse edh-engine''s
      split-on-'' // '' indexing; add face-name keys and curly-apostrophe + accent
      normalization.'
    - 'Bulk file = `oracle_cards` (one object per Oracle ID, ~173 MB, regenerated
      ~daily). Correct for a classifier that keys on name+colors+type+legality. Bulk
      download = no rate limit; REST fallback <=10 req/s with a 50-100ms delay; required
      headers User-Agent + Accept: application/json (edh-engine already sets these).'
    - 'legalities.legacy is one of {legal, banned, not_legal, restricted} — but RULES/legality
      validation should treat Legacy as a BLACKLIST (per legacy-foundations.md): trust
      a version-stamped banned-list set, not Scryfall''s `legacy` flag alone (Scryfall
      lags B&R announcements by hours-to-days).'
    - 'REUSE VERDICT: EXTEND, don''t fork. edh-engine/ingestion/scryfall.py transfers
      wholesale (bulk download, name index, batch /cards/collection fallback). Add:
      (a) load the FULL oracle pool not a meta-scoped subset — Legacy''s card pool
      dwarfs a cEDH meta''s ~3,148 cards (~30k+ oracle IDs), so resolve-by-name against
      the whole index, don''t pre-resolve a fixed pool; (b) a Card model with derived
      colors_of_lands/colors_of_nonlands + Legacy staple_role/is_free_spell tags;
      (c) a colors-of-deck helper implementing GetColors.'
    - 'staple_role / is_free_spell / mana-base tags are NOT in Scryfall — derive them:
      is_free_spell from oracle_text alt-cost patterns (''without paying its mana
      cost'', ''exile ... from your hand'', ''rather than pay''); land mana-base tags
      from type_line (''Land''), produced_mana, oracle_text (''enters tapped'', ''Search
      your library ... land''); staple_role from a curated name->role table seeded
      by legacy-foundations.md''s staples table.'
