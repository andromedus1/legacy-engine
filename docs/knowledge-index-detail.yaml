  docs/briefs/ingestion-archetype-contracts/archetype-matching-algorithm.md:
    summary: |
      Reverse-engineers the MTGOArchetypeParser C# engine (one ~210-line method ArchetypeAnalyzer.Detect):
      AND-tests every archetype's conditions, collects all matches (emits Conflict(...) with no default
      tie-break), nests variants, falls back by most-shared-cards (10% floor), computes colors by
      land/nonland intersection. Includes Python-ready pseudocode.
    key_findings:
      - "Core is one method ArchetypeAnalyzer.Detect; a rule matches only if ALL conditions pass (AND, short-circuit)."
      - "NO default tie-break (Conflict(...)); PreferSimpler picks fewest-conditions match."
      - "Variants nested: tested only if parent matched; N passing variants → N matches (a conflict)."
      - "Fallback fires only when zero archetypes match; scored by summed Count, ≥10% similarity floor else Unknown."
      - "Colors = intersection: a color counts only if in ≥1 LAND AND ≥1 NONLAND."
      - "Card-name matching is exact, case-sensitive; no normalization in the engine — a hard upstream contract."
      - "Output: ArchetypeResult{Matches[], Color, Companion?} flattened to RecordArchetype{Archetype, Color, Companion}."
    related:
      - {slug: docs/briefs/ingestion-archetype-contracts/parent.md, relationship: refines}
      - {slug: docs/briefs/ingestion-archetype-contracts/mtgoformatdata-rule-schema.md, relationship: depends-on}
