  docs/SPEC.md:
    summary: 'Capability spec for legacy-engine. Defines the system''s capabilities
      across four pillars, the core

      domain entities (Card, Decklist, Archetype, Variant, TournamentResult, MatchupCell,
      InteractionFacts,

      Player, Venue, SideboardPackage, Inventory, UserDeck), the built capability
      set (ingestion + meta

      analytics + advisory + collection/prices/players/variant/venue/speculation subsystems
      + all deck

      generation modes), and non-functional requirements (reproducibility, version-stamped
      legality,

      sample-size confidence metadata, uncertainty-qualified language, and honest-degrade
      policy).

      '
    decisions:
    - Built capability set = card-data ingestion, prices ingestion, tournament-results
      ingestion, archetype parsing + variant tagging, meta analytics (tier list /
      meta-% / matchup matrix / per-card win-rate / subgroup split / venue divergence
      / new-card speculation), the advisory layer (positioning + maindeck-aware sideboard
      + what-to-play + field-read report + collection-aware acquire + refresh + primer),
      future-only validation surfaces (advise benchmark, advise recurrent-validation,
      and the benchmark-scoped player-effect diagnostic), player-strength + history,
      and all deck generation modes 1+2+3+export (consensus baseline with --variant/--players/--strong,
      field-tuned decklist, gap-discovery, deck doctor), the archetype-sweep backtest
      (advise sweep), and data-driven subarchetype resolution (discover run|list|apply|promote
      + opt-in variant overlays).
    - Deferred capabilities = goldfish simulation (Deck Mechanics pillar); goldfish-validated
      candidate-validation remains deferred until goldfish/ ships. Gap-discovery (mode
      3) itself is built.
    - 'Core entities: Card, Decklist (75-card maindeck+sideboard), Archetype, Variant
      (sub-archetype tag), TournamentResult, MatchupCell, InteractionFacts (pure card
      interaction classifier), Player (resolved identity + strength record), Venue
      (online/paper), DeckDefinition (deck-as-data for sim — later), SideboardPackage,
      BanListSnapshot, Inventory, UserDeck.'
    - Meta-% is computed under multiple definitions (raw entry count, top-cut presence,
      win-rate-weighted) and every report is labeled online/paper/blend — never a
      single unlabeled number.
    - Matchup cells and derived stats carry sample size, intervals, provenance, and
      uncertainty metadata; low-n and prior-only values remain visible with qualified
      wording rather than being silently suppressed.
    - 'Reproducibility is an NFR: deterministic given inputs+seed; all external data
      pre-fetched and cached; legality validated against a dated BanListSnapshot.'
    - Visualization is a cross-cutting Vega-Lite presentation layer (interactive HTML
      via vega-embed + static PNG via vl-convert); headline deliverable is a reusable
      per-deck dashboard composing meta-share/matchups/trends/positioning/consensus.
      Self-contained + offline; no server, no editing GUI.
    - 'HONEST-DEGRADE NFR: thin/absent signal surfaces a labeled banner or degraded
      flag with a named reason. No silent zeros, no fabricated numbers. Applies in
      the advisory window (thin-regime banner), sideboard/primer (degraded=True note),
      the sideboard recommender (returns fewer than 15 with commit/insurance labels
      + a marginal-coverage curve rather than padding to a forced 15), speculation
      (PRE-DATA FORECAST label), prices (all_null flag), venue divergence (labeled).'
    - 'PRICES + ACQUISITION: seed prices + report prices + advise acquire give the
      user a priced buy list ranked by field-relevance × archetype-relevance; PriceQuote.all_null
      is the honest-null signal.'
    - 'STABLE ERAS: the built detector persists per-entity boundaries and stable_since
      fallbacks; the recurrent validation surface now freezes cutoff-safe recurrent
      origins against the hash-bound parent benchmark plan, scores current-only /
      contiguous-era / recurrent-expanded evidence plus additive amplification methods
      on a common future ledger, aggregates exact promotion assessments, and can write
      only inert operator-review proposals. The intended serving-time recurrent-era
      contract still certifies a union of compatible historical intervals with outcome-free
      discovery, affectedness/context/support guards, and pairwise subject/opponent
      intersection. Current-only evidence remains the fallback, and expanded evidence
      cannot become authoritative without future-only validation.'
    - 'SUPERARCHETYPES: a third taxonomy level ABOVE parent archetype — strategy clusters
      derived from staple-stripped maindeck core sets (Jaccard + average-linkage agglomerative,
      AU-bootstrap cut) with a curated override layer, persisted as a registry by
      an offline pass. A subject''s record against a cluster is a random-effects (DerSimonian-Laird)
      pooled proportion whose effective sample n_eff — not raw pooled n — feeds tier_for_sample
      and the display gate, gated on concentration (m_eff = 1/HHI >= 2.0, max member
      share <= 0.60) and heterogeneity (I-squared bands, with I-squared treated as
      ONE-SIDED evidence). Typed family cells carry labeled provenance and intra-cluster
      flags; Deck Rankings uses strategic-plan and exact matchup views while keeping
      composition-derived family evidence internal.'
    - 'DECK RANKINGS: `advisory/deck_ranking.py` computes full-field posterior mean
      performance and the non-mirror floor, with intervals, prior provenance, coverage,
      and Pareto status. A private field override reweights the same cells while global
      corpus presence retains candidate eligibility; local strategic-plan projections
      remain unavailable until composition-specific aggregates exist. Successive compatible
      publications add deterministic field/matchup attribution and changed-call observations;
      expanded rows add descriptive parent-versus-build diagnostics. These additions
      remain outside ranking authority and taxonomy.'
    - 'DECK RANKINGS EVALUATION BOUNDARY: the current projection remains descriptive.
      `scripts/evaluate_deck_rankings.py` retains its default field-method diagnostic;
      separate `--served-model` phases freeze all six cutoff-refitted predictions
      before development scoring, then require a sealed development selection before
      confirmation outcomes open. The hash-pinned production parent taxonomy includes
      color splits while camps remain disabled. Development selected scale 2, but
      confirmation slightly favored the current scale 1 on log loss and Brier, so
      production retains scale 1. The page may disclose dated scores and call sensitivity;
      evaluation has no publication gate.'
    - 'RANKING BENCHMARK: the future-only parent-archetype validation preregisters
      exactly ten estimators with production-ci-gated as the production-CI primary;
      retrospective-fixed-parent (frozen parent-rules identity) and dated contemporaneous
      taxonomy replay are separate modes. The protocol freezes its exact whole-date
      fold schedule and as-of B&R ledger. Raw pre-cutoff snapshots and prediction-before-evaluation
      hashes, deck-mass field coverage, explicit support/censoring gates, stable event-block
      field-weighted regret with structural mirror utility, player-sensitivity boundaries,
      proper scores, and dated parent-taxonomy external snapshots are part of the
      evidence. Deterministic paths allow byte-identical replay and reject different
      overwrites. Evaluation is read-only and never tunes production.'
