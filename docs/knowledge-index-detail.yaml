  docs/briefs/card-adjacency-and-discovery.md:
    summary: 'Curates the approach for "discovery" deck tuning (deck-generation mode
      3, card-gap half): an adjacency

      model that nominates cards a shell does NOT already run (role/color/CMC + decklist
      co-occurrence), a

      cross-archetype transfer of the shipped per-card×matchup value so the nominations
      are evidence-backed, and

      a confidence-gating scheme that keeps exploratory picks honest without the (deferred)
      goldfish pillar.

      '
    key_findings:
    - All adjacency inputs already exist in-repo — reuse whattoplay._card_roles (oracle-text
      role classifier), card_tags (staple roles + mana-base tags), Card.colors/cmc/type_line,
      and deck_cards for co-occurrence. No new NLP needed for v1.
    - Recommended v1 adjacency = role-match ∩ color-legal ∩ CMC-band, RANKED by decklist
      co-occurrence lift (PMI over the 63k-deck corpus). It is the heuristic, auditable
      analogue of card2vec — embeddings are a later upgrade, not a v1 requirement.
    - 'Cross-archetype value transfer is valid for ANSWER/HOSER roles (a card''s lift
      vs a combo deck is largely pilot-independent) and INVALID for synergy/engine
      cards (value is deck-context-dependent). Gate transfer by role: transfer answers,
      never transfer engine pieces.'
    - 'Discovery is exploratory: gate on the EXISTING ConfidenceMetadata tiers but
      require cross-field n at the established tier (≥100) for a transferred recommendation,
      and ALWAYS label it presence-correlational + not-yet-goldfish-validated. A confidence-gated
      v1 ships without goldfish.'
    - 'The archetype-gap half (high positioning-S, low meta-share) is mechanical:
      rank archetypes by S − f(share); no research needed beyond the existing positioning
      + metashare surfaces.'
    - Prior art (card2vec, 17Lands generalised representations, oracle-text sentence-transformer
      clustering) confirms decklist co-occurrence alone yields strong similarity,
      but is archetype-confounded — which is exactly why our role/color gating + value-transfer-by-role
      is the honest layer on top.
  docs/briefs/card-semantics-ir.md:
    summary: 'Curates the design space for a validated card-semantics intermediate
      representation (IR)

      replacing regex+memory in the new semantics/ module. Grounds the schema in the
      actual

      28-regex inventory and the four tag vocabularies the advisory layer consumes,
      in the

      Comprehensive Rules'' own template vocabulary (cost templates, keyword enumerations),
      and in

      prior art (Forge/XMage capability DSLs, Scryfall keywords/Tagger, grammar-parser
      attempts).

      Recommends clause-scoped typed facts over a closed capability vocabulary, extracted
      in

      tiers (deterministic templates → batched LLM → curated overrides), validated
      by golden

      fixtures per semantic cluster plus a full-corpus classification census.

      '
    key_findings:
    - 'Every production machine-readable MTG semantics system converged on the same
      shape: a closed vocabulary of parameterized capability predicates maintained
      as reviewable per-card data (Forge''s `A:SP$ Counter | ValidTgts$ Card.nonCreature`
      script DSL, XMage''s typed ability/cost/filter component library) — none parse
      free text at runtime, and full-grammar attempts stall (a published ANTLR4 grammar
      covers exactly one 273-card set with documented ambiguity failures; demystify
      remains a perpetual project).'
    - Scryfall's `keywords` array is free structured semantics for keyword mechanics
      only — Murktide Regent returns ['Flying','Delve'] but Force of Negation (pitch)
      and Leyline of the Void (opening-hand) return [] — precisely the templates the
      advisory bugs live in; ingest the field (the Card model currently drops it)
      but it cannot replace text-derived facts.
    - 'The 28-regex layer fails on four MISSING DIMENSIONS, not 28 bad patterns: owner-scope
      (Exhume''s ''their graveyard''), object-type (''destroy target land'' → creature-based),
      clause-role (FoN''s cost-clause ''exile'' + replacement-clause ''graveyard''
      → graveyard-hate false positive), and polarity (FoV carrying attacks={greedy-manabase}
      when it PROTECTS greedy manabases; the catalog''s ''_hate'' pseudo-tag is the
      same missing axis) — every verified bug maps to one, so the IR schema must carry
      all four as first-class typed fields.'
    - 'The highest-value templates are CR-canonical, not folklore: CR 118.9 names
      the exact alternative-cost phrasings (''You may [action] rather than pay [this
      object''s] mana cost'' / ''without paying its mana cost''), and the cost/effect
      split is a rules concept (118.8/118.9 + casting rule 601.2b), so tier-1 deterministic
      extractors can be specified against the rulebook; CR 701/702 enumerate 69 keyword
      actions and 194 keyword abilities as a closed vocabulary (MTGJSON ships it as
      data: 78/220 incl. variants).'
    - Oracle text is a retroactively re-templated corpus — Wizards rewrote 'his or
      her' to 'their' across Oracle in 2018 — so extraction must be versioned against
      a dated card snapshot, golden fixtures must pin verbatim oracle text (a re-template
      then breaks loudly), and possessive-scope vocabularies must include 'their'.
    - 'Recommended IR: clause-scoped typed facts over a CLOSED capability enum (~20
      capabilities cover the advisory-consumed scope) with typed params (object_type,
      owner_scope, polarity, clause_role, timing, condition, magnitude) + verbatim
      evidence quote + provenance + confidence per fact; all four consumer vocabularies
      (hoser attacks, whattoplay vulnerability/roles, linchpin neutralized_by, InteractionFacts)
      become pure derivations over facts.'
    - 'Validation: hand-curated golden fixtures per semantic cluster are the ONLY
      correctness gate; a full-corpus classification census over all 39,452 cards
      (35,698 with oracle text) pins per-capability membership counts as the drift
      regression; Scryfall Tagger via `otag:` search queries is a divergence DIAGNOSTIC
      (community data, never gating); Forge''s card-script corpus is GPL-3.0 — read-only
      prior art, no bulk import.'
  docs/briefs/change-point-detection.md:
    summary: 'Curates change-point detection methods for legacy-engine''s per-entity
      stable-era detection.

      Grounds the method choice in the real corpus (weekly series of 30-130 points;
      mid-tier archetypes

      at 2-8 decks/week; camps at 2-12/week; two measured ground-truth disturbances
      — the Candelabra ban

      cliff and the one-week Flow State adoption step) and in the CPD literature:
      signal-typed detector

      ensemble (presence rules for cliffs/ramps, kernel/energy CPD for composition
      drift, Beta-Binomial

      models for shares/win-rates), PELT + penalty as the offline segmenter, BOCPD/CUSUM
      for the online

      drift alarm, permutation p-values + BH-FDR + min-segment floors for fleet-level
      false-positive

      control, and the ban/release ledger as the calibration ground truth.

      '
    key_findings:
    - 'This corpus''s disturbances are LOUD: Flow State went 0%→90-95% inclusion in
      ONE week across three archetypes, and the Candelabra ban collapsed Tron 59→1
      decks/week in two — simple per-card presence rules (release ramp, ban cliff)
      detect the sharpest era boundaries with ~1-2 weeks latency; generic CPD is only
      needed for the gradual composition-drift residual.'
    - 'Never trust CPD defaults: on real-world benchmarks the trivial zero-changepoint
      detector outperforms many published methods at default parameters, and textbook
      penalties (AIC/BIC) are calibrated to correctly-specified models and ''lack
      robustness … in the presence of model mis-specification'' — calibrate the penalty
      against the project''s own labeled ban/release ledger.'
    - 'The penalty IS the false-positive knob (''adding a changepoint always reduces
      the overall cost''); across ~50-150 entity series, use per-change-point permutation
      p-values (E-Divisive''s #{q_r ≥ q_0}/(R+1)) corrected with Benjamini-Hochberg
      FDR, plus a minimum-segment floor tied to the engine''s sample tiers (E-Divisive''s
      own default is min.size=30 observations).'
    - 'Weekly counts are too small for normal-approximation monitoring (NIST: Poisson
      normal approx needs mean ≥5; mid-tier archetypes run 2-8 decks/week) — use share-of-field
      proportions and exact Beta-Binomial/Poisson-Gamma likelihoods (BOCPD), never
      raw-count z-scores; guard the partial trailing week, which drops EVERY entity''s
      raw count.'
    - 'Composition drift is a multivariate distribution change on the discovery flex-band
      vectors: kernel-cost CPD (''can be combined with any kernel … not just R^d-valued
      signals'') or energy-statistic E-Divisive (''able to detect any type of distributional
      change'') both fit; PELT gives exact penalized segmentation at trivial cost
      on 30-130-point series.'
    - No Python BOCPD package ships count-data likelihoods (the reference implementation
      has only StudentT/MultivariateT — verified against source); the Poisson-Gamma/Beta-Binomial
      conjugate recursions must be implemented in-project as a small module (scipy
      is already a core dep); ruptures is the offline dependency to add — it has no
      Poisson cost either, so count signals route through proportions or a custom
      cost.
    - 'Known ban/release dates are labels and priors, never the source of truth: snap
      detected change points to announcements within a tolerance to NAME the trigger;
      a detected cliff with NO matching announcement is the drift alarm (banlist-currency
      check) — the mechanism that would have caught Candelabra 2 days after the ban
      instead of 6 weeks later.'
  docs/briefs/data-autonomy-upstream.md:
    summary: 'Reverse-engineers the upstream tournament-data pipeline legacy-engine
      consumes (fbettega''s

      mtg_decklist_scrapper → MTG_decklistcache), diagnoses the July 2026 outage (one
      person''s home

      server, no CI, no alerting — the second multi-day stall of 2026), and assesses
      the epic''s fixed

      hot-spare ambition: run the same scraper ourselves on a schedule, verify spare
      output against

      the existing cache parser, and flip CACHE_DIR only when upstream is down. Also
      pins the

      machine-readable sources and polling designs for B&R + set-release monitoring,
      launchd

      scheduling patterns for the maintainer''s Mac, and a feasibility verdict on
      Card Kingdom prices.

      '
    key_findings:
    - 'The entire upstream is one person''s home server: no GitHub Actions in either
      fbettega repo, and the July 2026 outage (26 days of missed daily updates, 07-02→07-28)
      was caused by a house move + server hardware changes; April 2026 had a second
      multi-day stall — hot-spare is justified by observed base rate, not paranoia.'
    - 'Running the scraper ourselves is LOW effort: pure Python (beautifulsoup4/requests/dateutil/numpy),
      one CLI entry point defaulting to a self-backfilling trailing 7-day window,
      idempotent file writes; MTGO — the engine''s primary Legacy source — needs no
      credentials at all (public pages with embedded JSON). Melee needs a real account
      login (undocumented endpoints, unverifiable ToS — the one gray zone); Topdeck
      has an official free-key API at 100 req/min.'
    - The scraper repo has NO license (cache repo is GPL-3.0) — fork it on GitHub
      and run it privately rather than vendoring/modifying/redistributing its code;
      treat our spare's output tree as private infrastructure, never republish.
    - 'Hot-spare verification is nearly free: our cache.py parse_cache_item + ingest_cache
      already define the schema contract, so spare-vs-upstream divergence checking
      is ''run both trees through the existing parser and diff tournaments/decks on
      overlap days'' — no new contract machinery.'
    - 'P0 side-finding: Scryfall bulk data is now JSONL-only (every /bulk-data entry
      has jsonl_download_uri and no download_uri), and ingestion/scryfall.py reads
      meta[''download_uri''] — the engine''s next cold `seed cards`/refresh will KeyError;
      fix before (or as part of) the scheduled-refresh feature.'
    - 'B&R monitoring should be two-signal: (a) detection = daily oracle_cards bulk
      diff of legalities.legacy transitions (values are legal/not_legal/restricted/banned;
      bulk collected every 12-24h, *.scryfall.io downloads unlimited); (b) attribution
      = polling the WotC announcement page family, which is server-rendered, uses
      fixed phrasing (''<Card> is banned.'', ''Changes effective as of <date>'', ''Next
      announcement: <date>'') and pre-announces the next B&R date — both feed the
      existing eras-confirm/append_ban_event registration loop, with the eras drift
      alarm as backstop.'
    - 'launchd: use StartCalendarInterval (jobs missed while the Mac sleeps fire once
      on wake, coalesced — unlike StartInterval, which silently misses); gui/<uid>
      LaunchAgents with absolute .venv paths, StandardOut/ErrPath logs, and a status
      JSON the session-start surface reads; launchctl kickstart is the manual catch-up
      verb.'
    - 'Card Kingdom is OPEN: api.cardkingdom.com/api/v2/pricelist is a public unauthenticated
      ~67 MB JSON (149,977 rows, scryfall_id join key, retail + buylist + per-condition),
      regenerated at least daily; LED spot check $949.99 retail confirms the CK-vs-Scryfall
      divergence that motivated the idea. MTGJSON (cardkingdom provider, retail+buylist,
      90-day history) is the sanctioned-aggregator fallback; TCGplayer direct API
      is moot.'
