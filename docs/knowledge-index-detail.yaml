  docs/analysis/copy-count-distribution-study.md:
    summary: 'Distribution-first study of per-card sideboard copy-count distributions
      among top-finisher

      boards (archetype-sweep payloads, 2026-07-04: 26 archetypes, 293 top-finisher
      decks global /

      153 local-field-scoped). Tests idea-copy-count-tipping-point''s "winners run
      fixers at 0 or 2+"

      hypothesis against the solver''s pure-concave per-copy taper.

      '
    key_findings:
    - 'The 0-or-2+ tipping point is CARD-MECHANIC-SPECIFIC, not category-wide: the
      hypothesis as stated is NOT supported for reactive fixers as a class (winners
      run them 53-60% as 1-ofs, concave-decreasing — engine 1-ofs are legitimate there).'
    - Hard valley-at-1 exists for pitch-fueled counters — Consign to Memory P(1)=0.04-0.06
      vs P(2)=0.59-0.65; Force of Negation & Mindbreak Trap mode-at-2 — cards whose
      alternate cost pitches a copy mechanically want a second copy as fuel; derivable
      from oracle text (pure-mechanics compliant).
    - 'Threshold cards are near-degenerate at the top: Leyline of the Void P(4)=0.83
      (''begin the game in play'' = opening-hand math wants 4); sideboard Show and
      Tell 100% 4-of (plan cards, not answers).'
    - 'Category PMFs conditional on inclusion (global): broad-counter mode-at-2plus
      (P2=.54); color-blast, reactive-fixer, dedicated-hate concave-decreasing — the
      current concave taper is empirically right for 3 of 4 classified categories.'
    - 'Solver-vs-winners divergence concentrates where predicted: 42-45% of solver
      broad-counter picks are 1-ofs where winners'' mode is 2+; only 17% for color-blasts.'
    - 'Modeling implication: per-card minimum-viable-count derived from MECHANICS
      (pitch-cost cards k_min=2; opening-hand threshold cards k_min≈4), not a category
      S-curve and never copied from winners'' frequencies — feeds the rules-engine
      arc (idea-card-semantics-rules-layer).'
    - Shapes replicate across the global and local-field-scoped payloads (robustness);
      most archetype winner samples are speculative-tier (n<30), honestly labeled
      — treat per-card PMFs with n>=20 as the reliable floor.
  docs/briefs/advisory-methods.md:
    summary: 'Methods brief for legacy-engine''s advisory/ module (the Legacy-specific
      differentiator). Pins down:

      (1) matchup-matrix estimation from sparse round data (Wilson CIs, Beta-Binomial
      shrinkage, confidence

      tiers, the bimodal-coverage caveat); (2) the meta-positioning score S(D)=Σ field_share·winrate
      with

      Bayesian Monte-Carlo uncertainty (Beta cells + Dirichlet shares) and best-deck-vs-best-call;

      (3) the sideboard recommender as weighted submodular max-coverage solved by
      ILP (PuLP/CBC) with a

      greedy (1-1/e) explainable fallback, plus the anti-hate second order; (4) the
      what-to-play advisor —

      a composition-derived proactivity score, transparent plan-clash heuristics,
      and vulnerability-tag-driven

      hate-equity. All framed for scipy/numpy + PuLP and edh-engine''s established/evolving/speculative
      confidence tiers.

      '
    key_findings:
    - 'Matchup cells: Wilson score CI as the single default (Jeffreys for n<=40);
      shrink low-n cells with a Beta-Binomial prior centered at 50% (strength alpha+beta~=10-20);
      mirror fixed at 50%; ALWAYS show cell n.'
    - 'Confidence tiers by matchup-cell n: speculative n<30 (hide the rate, show n),
      evolving 30<=n<100, established n>=100 (Wilson half-width at p=0.5 is +-0.17
      at n=30, +-0.096 at n=100). Display gate is n<30, NOT n<100.'
    - 'Bimodal-coverage caveat is mandatory: matchups come ONLY from rounds-bearing
      events (Challenges + paper); MTGO Leagues feed meta-share but not matchups.
      Keep matchup-sample and meta-share-sample as separate labeled fields — never
      conflate.'
    - Meta-positioning score S(D)=Σ_a w_a·winrate(D vs a) = expected WR vs the weighted
      field; use Bayesian Monte-Carlo (Beta posteriors on cells + Dirichlet posterior
      on shares) as primary uncertainty method; rank decks by probability-of-being-best
      from shared-field draws. Always report S(D) AND the unweighted aggregate (best-call
      vs best-deck).
    - Sideboard recommender = weighted MAXIMUM-COVERAGE (budget 15 slots), NOT set-cover;
      value = field_share x matchup-swing with a SATURATING (submodular) coverage
      function; solve EXACTLY with an ILP (PuLP/CBC, trivial scale) and keep greedy
      (1-1/e guarantee) as the explainable fallback. Bounded-integer copies; color/deck-fit
      pre-filter; anti-hate counter-hosers modeled as expected-opposing-hate pseudo-elements
      in one unified pass.
    - 'What-to-play: derive a continuous PROACTIVITY score from card composition (reactive
      mass = counters+removal+stax+draw+protection; proactive mass = fast-mana+ritual+tutor+low-curve+compact-combo),
      tag archetypes with VULNERABILITY classes (graveyard-recursion, graveyard-fuel,
      plays-<color>, combo, low-curve, nonbasic-manabase, artifact-mana-reliant, creature-based,
      low-interaction, storm-reliant, ramp, noncreature-reliant, colorless-reliant),
      compute hate-equity = field share each hate category attacks (coverage, not
      naive sum), and classify best-deck (low matchup-spread, robust) vs best-call
      (high-spread, field-specific gamble).'
    - No published prior art formulates sideboard-as-optimization (one NIU thesis
      403-blocked, flagged for manual pull); the OR theory (max-coverage, NWF 1978
      submodular greedy) is load-bearing and the MTG community confirms the inputs
      (matchup matrix + field share) are the right primitives.
