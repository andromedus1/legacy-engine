  docs/briefs/ingestion-archetype-contracts/prior-art-scan.md:
    summary: 'Maps the existing tooling around the Badaro/fbettega Legacy decklist
      ecosystem to decide what

      legacy-engine should reuse vs. build. Headline: NO maintained, standalone Python
      port of

      MTGOArchetypeParser''s rules engine exists — the canonical archetype matcher
      is still Badaro''s

      C# tool (MIT, archived Sept 2025), and the community''s de facto pipeline is
      "C# parser →

      Aliquanto3/Jiliac R reports." fbettega ported only the SCRAPER to Python (mtg_decklist_scrapper)

      and still labels archetypes with the C# parser before feeding R. The two non-rules
      alternatives

      are videre-project/nbac-worker (Python multinomial Naive Bayes classifier, Apache-2.0,
      not

      rules-based) and j6e/mtg-meta-analyzer (TypeScript, signature-card + KNN, not
      Python). For card

      resolution / decklist parsing, mature Python libs exist and should be adopted
      (Scrython, mtg_parser).

      '
    key_findings:
    - 'HEADLINE / PORT VERDICT: there is no maintained standalone Python port of the
      MTGOArchetypeParser RULES engine (InMainboard / OneOrMore / Fallback-pile logic).
      legacy-engine is genuinely building the Python rules-matcher. Adopt the RULE
      DATA (MTGOFormatData JSON, MIT), port the ALGORITHM.'
    - Canonical matcher = Badaro/MTGOArchetypeParser — C#, MIT, ARCHIVED 2025-09-24
      (read-only). Still authoritative as a spec/reference, not a runtime dependency.
    - De facto community standard pipeline = MTGODecklistCache (JSON) → MTGOArchetypeParser
      (C#, labels decks) → Aliquanto3/Jiliac R-Meta-Analysis (R, produces meta share
      + matchup matrices). This is the workflow legacy-engine re-implements in Python.
    - 'fbettega is the LIVE data source: mtg_decklist_scrapper (Python, ''adapt badaro
      work in python'' — SCRAPER ONLY, MTG_decklistcache as git submodule) + Magic_data_analysis
      (R fork of Aliquanto). It still uses the C# parser for labeling — no Python
      classifier inside.'
    - videre-project/nbac-worker — Python, Apache-2.0, multinomial Naive Bayes archetype
      classifier covering legacy among 6 formats. NOT rules-based (no MTGOFormatData),
      architected as a Cloudflare Worker. LEARN-FROM (ML fallback idea); core src/nbac/
      extractable but don't adopt wholesale.
    - j6e/mtg-meta-analyzer — TypeScript/Svelte, MIT, actively maintained (v0.3.1,
      Mar 2026). Signature-card rules + KNN fallback, melee.gg ingestion, produces
      matchup matrices + scatter plots. LEARN-FROM (classifier design + viz), wrong
      language to reuse.
    - 'CARD-CONTRACT libs to ADOPT: Scrython (Scryfall wrapper, Py, built-in rate
      limiting in 2.x); mtg_parser (EUPL-1.2, parses 11+ decklist sources incl. MTGO/Moxfield/MTGGoldfish,
      active Apr 2026) — but mtg_parser does NOT resolve cards or classify archetypes.'
    - edh-engine (our sibling) used NONE of these — hand-rolled httpx + BeautifulSoup
      + pydantic. Legacy's archetype-parser layer is net-new; the scrython/mtg_parser
      adopt decision is the one place to break from edh-engine's hand-roll habit.
