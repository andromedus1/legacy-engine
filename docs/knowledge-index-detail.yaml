  docs/briefs/legacy-foundations.md:
    summary: 'Grounding brief on Legacy format fundamentals for the legacy-engine
      analytics platform.

      Covers Magic''s turn structure / stack / state-based actions (framed for goldfish
      simulation),

      the London mulligan and its hand-quality math, and Legacy''s deck-construction
      + banned-list

      constraints with the format-defining staple cards. Frames every section for
      the eventual

      platform (deck-as-data model, mana solver, mulligan Monte Carlo, legality validation).

      '
    key_findings:
    - A Legacy goldfish sim needs ~8 core rules encoded; the heart is a mana-payment
      solver (can_pay(cost, untapped_sources)) plus a LIFO stack for the deck's own
      triggers (CR 405/601/605).
    - Legacy uses straight London mulligan, NO free mulligan; model keep() and bottom()
      as separate archetype-parameterized functions via Monte Carlo, not closed-form
      hypergeometric.
    - London disproportionately benefits combo/specific-card decks (+10-18pp to assemble
      "the nuts"); calibrate the sim against published tables (Chalice T1 53->63%,
      Power Monolith 21->31%).
    - Legacy legality is a BLACKLIST (all cards legal except the banned list) — unlike
      Standard/Modern whitelists; banned list changes ~quarterly and must be version-stamped
      by date.
    - Legacy bans outright what Vintage restricts (Power 9, Sol Ring, etc. are 0-of
      in Legacy); no restricted list exists. "Free" interaction (Force of Will/Daze)
      is the defining structural trait.
    - Banned list is current as of the May 18 2026 announcement (Undercity Informer);
      next scheduled June 30 2026.
  docs/briefs/legacy-metagame.md:
    summary: 'The core domain brief for legacy-engine. Maps the 2026 Legacy metagame:
      the four-pillar tier

      structure (no Tier 0), per-archetype game plans and goldfish turn-to-kill clocks,
      the data-source

      ecosystem (the edhtop16 analog), and the strategic landscape of how to attack
      the field (matchup

      matrix, hosers-by-target, sideboard strategy, "what to play"). Every section
      is framed for the

      analytics platform''s ingestion, simulation, and advisory pillars.

      '
    key_findings:
    - 2026 Legacy is a blue-tempo-centered four-pillar format with NO Tier 0; Dimir
      Tempo is
    - The data ingestion analog to edhtop16 is the fbettega community pipeline (mtg_decklist_scrapper
      + MTG_decklistcache, both pushed 2026-05-29) labeled by Badaro/MTGOFormatData
      archetype rules; Scryfall is the shared card-data source. NO clean official
      API exists.
    - Legacy needs an explicit archetype-PARSER layer that cEDH does not (no commander
      to key on) — this is the key architectural delta from edh-engine.
    - Goldfish clock ladder (turn-to-kill, unopposed) — calibration anchor Oops All
      Spells = 66% T1 / 76% by T2 / 83% by T3 [cited]; combo T1-3, fair tempo/control
      T4-6+ (win by disruption/attrition, not a clock).
    - Meta-speed metric = per-archetype goldfish-clock PMF weighted by meta share;
      model BOTH a goldfish clock (upper bound) and an effective clock (convolved
      with Force of Will/Daze survival) — the gap is a format-health signal.
    - Aggregator sites (MTGGoldfish/MTGTop8/mtgdecks) are HTML-only and 403-block
      bots; meta % is computed differently by each (top-cut presence vs raw count
      vs winrate-weighted) and online/paper diverge materially — compute % yourself
      from raw finishes under multiple definitions and label the source.
    - The universally-agreed format constant: dedicated graveyard hate + free counters
        belong in every sideboard (Reanimator + Oops + Sneak&Show + Painter are all
        GY/combo-adjacent).
  docs/briefs/scorer-flexibility-valuation.md:
    summary: 'The sideboard scorer undervalues broad, flexible interaction: a card
      that answers many matchups

      (Force of Negation) has its value fragmented across tiny per-(archetype,tag)
      elements and scores

      ~0, though it is near-universal in winning boards. This brief shows the fix
      is NOT a "flexibility

      bonus" or an empirical prior — the coverage objective is already submodular,
      and submodular

      maximization credits breadth correctly via marginal gain. The gap is that three
      distortions starve

      the breadth signal (misapplied concavity, deflated/uncoverable element weights,
      missing

      attachments). It recommends: repair the objective so a card is credited by its
      TOTAL marginal

      coverage across all elements it answers; add a pure-mechanics option-value term
      (tail-robustness

      over the Dirichlet field) so flexibility is valued under uncertainty; keep empirical
      winning-board

      frequency as a divergence diagnostic only.

      '
    key_findings:
    - Coverage maximization is monotone submodular; the greedy/ILP solver ALREADY
      credits breadth via marginal gain (a card covering many needs has large marginal
      value) — the model is the right shape, so the fix repairs distortions rather
      than adding a flexibility heuristic.
    - The breadth signal is starved by three distortions, not by the model's form
      - (1) the concave saturation g() is applied per-element (diminishing returns
      on stacking copies for ONE matchup) instead of across the card's breadth; (2)
      opponent elements are deflated (uniform draw_prob≈0.4 factor) and the biggest
      weights are uncoverable `_hate` self-protection pseudo-elements that crowd out
      real coverage; (3) broad cards fail to ATTACH to the elements they answer (plays-blue
      never fires as an opponent vulnerability; no broad-interaction attribution).
    - Flexibility has first-principles OPTION VALUE under field uncertainty - a card
      that answers many archetypes has lower-variance value across draws of an uncertain
      (Dirichlet) field; a tail-aware / CVaR objective term rewards this hedge WITHOUT
      any empirical inclusion signal, letting the engine value breadth from mechanics
      alone.
    - MTG-domain expertise agrees - broad overlapping answers earn slots and "stretch"
      a 15-card board; over-dedicating to narrow hate is a known failure mode; if
      a matchup needs the whole board, change decks, don't spend the board (validates
      the punt/slot-ROI logic).
    - ? Keep the pure-mechanics guardrail - do NOT fold winning-board inclusion% into
        the score (regresses to consensus). The backtest stays a divergence diagnostic
        + acceptance gate
      : model≠consensus is a flag to investigate (missing mechanic OR a real edge),
        not an error to calibrate away.
  docs/briefs/sideboard-core-and-hedge.md:
    summary: 'Curated context for reworking the sideboard recommender into a two-stage
      core+hedge solver.

      Extends advisory-methods.md (which already owns max-coverage / greedy-1−1/e
      / Dirichlet). Resolves

      four deferred decisions: the per-copy access-probability curve, sideboard construction
      theory (the

      "natural budget"), the hedge''s field-uncertainty objective, and the core/hedge
      boundary τ. Recommends

      defaults where evidence is strong (the copy curve, the construction principles);
      stays neutral where

      the call is judgment (hedge aggressiveness, τ).

      '
    key_findings:
    - The naive 'P(≥1 access)' hypergeometric curve is only MILDLY concave (opening-7
      marginal per copy ≈ 11.7→10.5→9.4→8.4%); it does NOT by itself justify capping
      copies. The real saturation driver is the disutility of redundant DRAWN copies
      (a 2nd hate card in hand is often a dead draw crowding out threats) + 15-slot
      scarcity.
    - 'Sideboard practice: dedicated swap packages run 3-4 copies; flexible/overlapping
      answers run as 1-2-ofs; over-sideboarding (''too many answers, not enough threats'')
      is a named failure. The padding bug = 4-of THREE overlapping hate pieces (12
      cards) with zero flex, not any single 4-of.'
    - Recommended Stage-1 marginal value of copy k of card C = swing(C) · ΔP_access(k)
      · U_redundancy(k), where ΔP_access is the hypergeometric increment and U_redundancy
      decays sharply after the 1st-2nd in-hand copy. This keeps the objective submodular
      (greedy 1−1/e holds; ILP via piecewise-linear concavity).
    - 'Hedge (Stage 2) is naturally framed as optimizing coverage over a WIDER field
      than the point estimate: reuse positioning.py''s Dirichlet share draws as the
      ambiguity set; expected-coverage is the simple dial, CVaR/worst-tail is the
      conservative dial (coherent risk measure). How wide / how conservative is a
      genuine judgment call — expose it, don''t hardcode.'
    - 'τ (core/hedge boundary) options: confidence-tier-linked (reuse tier_for_sample),
      a swing-floor, or operator-tunable. No evidence forces one; recommend operator-tunable
      with a tier-aware default and surface the marginal-coverage curve so the human
      can see the knee.'
  docs/briefs/subarchetype-discovery.md:
    summary: 'Curates the method for full-unsupervised, statistically-self-validating
      subarchetype discovery for

      legacy-engine. Grounds representation, distance, clustering-algorithm, and validation
      choices in the

      real corpus (within a parent the effective vocabulary is ~120-260 cards, stratified
      into a

      ubiquitous core / a ~20-30-card flex band where splits live / a rare noise tail)
      and in the closest

      MTG prior art (Lucky Paper''s Jaccard→UMAP→HDBSCAN pipeline). Specifies how
      a variant dimension keys

      into the matchup matrix and per-card win-rate while preserving the Beta-Binomial
      shrinkage + tier gates.

      '
    key_findings:
    - Within a single parent archetype the effective feature space is small (~120-260
      distinct main cards, not the ~40k global oracle) and stratifies into ubiquitous
      core (no signal) / ~20-30 flex cards (all the split signal) / a long rare tail
      (noise) — cluster on the flex band, not raw card-space.
    - 'The closest production precedent (Lucky Paper''s Commander/Cube Map) matches
      the recommended shape: deck-card matrix → Jaccard distance → UMAP reduction
      → HDBSCAN (self-determines k, labels noise) → human-readable validation; recommend
      TruncatedSVD/LSA or UMAP to ~10-50 dims first because HDBSCAN degrades past
      ~50-100 dims.'
    - Copy counts carry real signal (the validated Doomsday split is bimodal on Tamiyo
      3.70 vs 0.98 copies), so prefer count/TF-IDF representations + cosine/Bray-Curtis
      over pure binary presence where the split is a quantity difference.
    - A discovered split is 'real' only if it clears BOTH statistical gates (resampling
      stability >0.9 / prediction strength >0.8; internal indices as a weak secondary)
      AND the domain gate the engine already trusts (both camps reach evolving+ sample
      tier; large signature-card inclusion/copy divergence).
    - Naive significance testing on clustered data is the double-dipping trap — type
      I error is extremely inflated even across independent datasets; validate on
      a held-out split or selective-inference test, never a plain t-test on the same
      data used to form the clusters.
    - A statistical cluster-count criterion can disagree with the human-intuitive
      archetype count (an MDL criterion picked 3 clusters where 5 was 'obvious');
      because color identity is the loudest low-dimensional signal, drop color-defining
      lands/duals so splits key on strategy — clustering within an already-color-fixed
      parent largely pre-empts this.
    - 'Integration: match_results.py keys on decks.archetype only; add an OPTIONAL
      variant dimension on one side of a cell (subject_variant × opponent_parent),
      reusing the existing Beta-Binomial shrinkage + speculative/evolving/established
      gates unchanged — every split cell surfaces at its own honest tier, never hidden,
      never blended.'
  docs/briefs/superarchetype-aggregation-adversarial-read.md:
    summary: 'Fresh-context adversarial read of all 83 citations in the superarchetype-aggregation
      brief against

      the 21 attestation files they resolve to. Verdict APPROVE-WITH-FIXES: 68 SUPPORTED,
      13 OVERSTATED,

      2 MISATTRIBUTED, 0 UNSUPPORTED, plus 9 UNCITED-CRITICAL load-bearing claims.
      No defect touches the

      recommended method — every finding is a sourcing/labeling defect or an over-precise
      derivation

      whose correction makes the gates MORE conservative, not less. All clear-cut
      findings were applied

      as narrowing edits to the brief in the same pass.

      '
    key_findings:
    - Zero UNSUPPORTED citations across 83. Every cited passage is real, quoted accurately,
      and bears on its neighbourhood — the failure mode in this brief is strength
      and labeling, not fabrication.
    - 'The dominant defect shape is a project-calibrated threshold sitting adjacent
      to a source citation that does not endorse that value: m_eff >= 2.0, the 0.60
      member-share cap, the I-squared action bands, and the AU >= 0.95 dendrogram
      rule all read as sourced in the at-a-glance table while the body correctly labels
      most of them as ours.'
    - The 60% max-member-share cap was the only gate parameter with NO grounding of
      any kind — no source, no measurement, no stated calibration — and it is the
      binding constraint at K>=3 (60/20/20 gives m_eff 2.27, which passes the concentration
      gate and fails only the cap).
    - 'Section 4.4''s claim that n_eff returns Sigma n_k when tau-squared = 0 is not
      exactly true: tau-hat-squared = 0 means undetected dispersion, not identical
      rates, and n_eff falls below Sigma n_k whenever member rates differ, by concavity
      of p(1-p). The error direction is safe — the gate is stricter than advertised.'
    - The pvclust feature-axis resampling claim — the entire justification for AU
      p-values working at N about 30 — rests on the attestation's unquoted summary,
      not on any quoted passage. Same for the HDBSCAN 'no density contrast at N about
      30' argument, which is neither sourced (the attested HDBSCAN limitation is dimensional)
      nor measured, in a brief that measures everything else.
    - The gao-selective-inference citation was used to raise the double-dipping hazard
      while the same attestation's next passage ('persists even if two separate and
      independent data sets are used') was left unquoted — the one passage that most
      directly challenges the brief's escape argument. The escape argument survives
      on the disjoint-variables-vs-disjoint-samples distinction, but that distinction
      had to be stated.
    - 'Coherence defect worth a design change: section 4.5 reads tau-hat-squared =
      0 as ''coherent cluster'' and awards the maximum prior strength of 30, while
      section 6.4 establishes that at these member sizes a zero mostly means ''we
      cannot see spread''. That hands maximum prior strength to 58.7% of cells on
      the weakest evidence — the exact inversion the heterogeneity gate exists to
      prevent.'
  docs/briefs/superarchetype-aggregation.md:
    summary: 'Curates the method for the superarchetype (strategy-cluster) layer:
      clustering archetypes by card

      composition at small N, aggregating member matchup cells into one cluster cell,
      and gating that

      cell for representativeness and pooling validity. Grounds every choice in the
      real corpus (in the

      2026-05-11 window only 4 of 1190 directed archetype cells clear n>=30; opponent-side
      pooling into

      ~8 clusters lifts that to ~16% and to 70% of cluster-vs-cluster cells) and in
      the hierarchical-

      models, paired-comparison, concentration-index and meta-analysis literatures.
      Specifies a

      random-effects pooled estimator, an effective-member concentration gate, an
      I-squared

      heterogeneity gate, the intra-cluster flag rule, and the exact rung the superarchetype
      occupies

      in the existing camp -> leave-camp-out parent'' -> marginal'' -> 0.5 shrinkage
      chain.

      '
    key_findings:
    - 'The epic''s premise is confirmed and worse than stated: in the 2026-05-11 window
      only 4 of 1190 directed archetype-vs-archetype cells reach n>=30 (0.3%), none
      reach n=100, 17.8% are literally n=0, and the median cell holds 2 matches —
      Cradle Control''s largest opponent cell is n=10 across 82 matches.'
    - 'Clustering must happen one level up in FEATURE space too: at the archetype
      level the format staples (Force of Will, Brainstorm, Ponder, Daze, Wasteland,
      the fetches, Underground Sea, Flow State — 14 cards that are core to >=30% of
      archetypes) dominate the similarity and fuse 16 of 34 archetypes into one ''blue''
      mega-cluster; TF-IDF''s soft down-weighting is NOT enough (cosine on IDF-weighted
      centroids still fuses 14 of 30) — the staples must be HARD-removed, which is
      the format-level analogue of the camp layer''s flex band.'
    - 'HDBSCAN should not be the primary algorithm here, on one decisive ground: any
      archetype pushed into the noise class gets no superarchetype at all — a coverage
      failure aimed precisely at the thin archetypes the epic exists to serve. (The
      secondary ''no density contrast at ~30 objects'' argument is author''s judgment
      — neither sourced nor measured.) Average-linkage agglomerative on a precomputed
      Jaccard dissimilarity assigns every archetype, and pvclust-style multiscale-bootstrap
      AU p-values computed over the CARD features rather than the archetypes are the
      proposed small-N branch validator.'
    - 'Coverage rises monotonically with coarser clusters and so does the risk of
      pooling unlike things: opponent-side pooled cells reaching n>=30 go 4.5% (K=17)
      -> 10.4% (K=11) -> 15.8% (K=8) -> 24.5% (K=6) -> 36.8% (K=4), and cluster-vs-cluster
      cells go 12.8% -> 70.3% at K=8 -> 93.8% at K=4. Granularity must be chosen by
      a heterogeneity criterion, never by a coverage target.'
    - 'Random-effects inverse-variance pooling is the estimator that self-degrades
      correctly: with tau-squared = 0 (58.7% of poolable cells measured exactly zero)
      its weights reduce to plain inverse variance, which for binomial cells is close
      to the intuitive pooled-counts answer, and as members disagree its weights flatten
      toward equality, automatically defusing the one-dominant-member problem instead
      of needing a separate rule.'
    - 'Both gates fire on the epic''s own motivating pair, which is the strongest
      possible validation: Dimir Tempo is 4-9 (30.8%, n=13) vs Aluren and 24-5 (82.8%,
      n=29) vs Show and Tell; the pooled cell reads 28-14 (66.7%, n=42) and would
      clear the display gate, but HHI=0.573 (1.75 effective members, one member supplying
      69% of n) and I-squared=0.89 both refuse it.'
    - 'I-squared is one-sided evidence here: median I-squared across poolable cells
      is exactly 0.000 and only 4.0% exceed 0.75, but Cochran''s Q has low power when
      units are few and small, and I-squared depends on the precision of the units
      — so a HIGH value is a reliable stop signal while a LOW value is never proof
      of exchangeability.'
    - 'Superarchetype membership does NOT need era-scoping the way camps do: co-membership
      agreement across the Jan-Apr and Apr-Jul 2026 windows is 0.957 on the 26 archetypes
      present in both, spanning both the Flow State adoption step and the Candelabra
      ban. Recompute membership on the same window the matrix is sourced over, surface
      churn as a diagnostic, and keep cluster identity stable.'
  docs/briefs/ingestion-archetype-contracts/parent.md:
    summary: 'Synthesizes a 7-specialist deep-research campaign into one buildable
      design for legacy-engine''s

      ingestion/ and archetype/ modules. Legacy decks arrive as bare 75-card lists
      with no commander key,

      so archetype labeling is a classification problem — solved by wrapping Badaro''s
      MTGOFormatData rules

      (vendored as pinned JSON) and reimplementing the ~600-line MTGOArchetypeParser
      matcher in Python.

      The campaign pins every data contract end-to-end: the fbettega PascalCase CacheItem
      JSON, the rule

      schema (conditions/variants/fallbacks), the exact matching algorithm, the C#→Python
      port + golden-test

      plan, the Scryfall card/color contract, and the ops/meta-% layer. The single
      most important seam: the

      card-data layer''s reuse verdict is contested — CARD-CONTRACT says extend edh-engine''s
      hand-rolled

      scryfall.py while PRIOR-ART says adopt Scrython/mtg_parser; this must be resolved
      at design time.

      '
    key_findings:
    - 'Archetype labeling is a CLASSIFICATION problem, not a key-lookup. Unlike cEDH
      (commander = the key), Legacy decks are bare 75-card lists. The decision is
      made: wrap Badaro/MTGOFormatData rules + port the MTGOArchetypeParser matcher
      to Python — and no maintained Python port of that matcher exists, so this is
      genuinely net-new code (PRIOR-ART).'
    - Own the matcher, rent the rules. Vendor MTGOFormatData JSON as a git-subtree
      pinned to a recorded SHA (data/archetype_rules/ + RULES_MANIFEST.json); reimplement
      ONLY the ~600-line matcher; reject shelling-out to the archived C# binary and
      .NET interop (PORT). The C# engine was archived 2025-09-24 — a frozen, lockable
      port target (PORT, CLASSIFY).
    - Deck color = INTERSECTION of lands' produced_mana (minus C) and nonlands' colors
      — NOT color_identity, NOT Scryfall colors-of-everything. A color is in the deck
      name only if it appears in BOTH a land source and a nonland card. edh-engine
      correctly uses color_identity for cEDH; legacy-engine must NOT (CARD-CONTRACT,
      CLASSIFY §5).
    - The fbettega schema is PascalCase CacheItem {Tournament, Decks[], Rounds[],
      Standings[]} with cards as {Count, CardName} — the README example is STALE (lowercase
      keys, Formats as list). Build against to_dict()/live files. Formats is a bare
      string in live files but typed List[str] — normalize defensively (INGEST).
    - Provenance (online vs paper) is NOT a field — derive it at ingest from the source
      DIRECTORY (MTGO/Manatraders→online; MTGmelee/Topdeck→paper) plus the Tournament.Uri
      host. Keep the provenance tag on every deck row; online and paper metagames
      diverge materially and meta-% must split on it (INGEST §3, SERVE/OPS §5).
    - Coverage is structurally BIMODAL and this gates what's computable. MTGO Challenges
      + paper Melee carry Rounds (per-match pairings) + Standings → we CAN compute
      our own matchup matrix (no dependence on the 403-blocked mtgdecks.net). MTGO
      5-0 Leagues are decklist-only (Rounds=[], Standings=[]) → they feed raw-count
      meta-% but NOT matchup cells or win-rate weighting. Empty Rounds/Standings is
      NORMAL, never an error (INGEST §6, SERVE/OPS §4).
    - Fidelity is the dominant port risk. The golden gate replays the archived C#
      parser's own labels over a frozen fbettega corpus at the same pinned rules SHA
      and asserts ≥99% per-deck label agreement (target 100%) as a CI check; every
      disagreement is a port bug, never silently accepted (PORT §4).
    - Drift is handled fail-fast, edh-consistent. A new archetype = zero code (data-driven);
      a new condition Type RAISES at load time (UnknownConditionTypeError) and the
      `legacy refresh rules` sync scan exits non-zero — a silently-skipped condition
      would mislabel decks and corrupt the meta-% the platform exists to produce (PORT
      §5).
    - Index the WHOLE oracle pool, don't pre-resolve a fixed pool. Legacy's card pool
      (~30k+ Oracle IDs, a Modern superset) dwarfs cEDH's ~3,148 cards; a new tournament
      can introduce any legal card, so the resolver must fall back to the full Scryfall
      oracle_cards bulk index, not a card_pool.json subset (CARD-CONTRACT §4).
    - Mirror-and-decouple is non-negotiable. The source layer is one community scrape
      (fbettega) over an upstream WotC actively destabilizes (Badaro's predecessor
      died 2025-06-10; MTGO degraded 2024-06-20; a Feb-2026 cut was rolled back in
      days). Vendor both repos pinned behind an ingestion/ port; analytics never reads
      live upstream; a staleness health-check degrades, never outages (SERVE/OPS §1-2).
    - Card-name matching is exact, case-sensitive string equality with NO normalization
      in the matcher — split/DFC/'//' handling is entirely an ingest/card-contract
      responsibility. The scraper already normalizes CardName to Scryfall-canonical
      form, but its map is runtime-built and drifts, so validate every name against
      our own mirror and route misses to an unmatched bucket, never drop the deck
      (INGEST §6, CLASSIFY §6, CARD-CONTRACT §2).
    related:
    - slug: docs/briefs/legacy-metagame.md
      relationship: depends-on
