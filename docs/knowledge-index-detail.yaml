  docs/analysis/best-call-ranking.md:
    summary: 'Runbook for decks/deck-rankings.html, a self-contained generated landing
      page. The

      refresh script retains the mature Best Call evidence ledger and adds a separately

      named current projection whose two visible priorities are full-field performance

      and the highest worst-matchup floor.

      '
    decisions:
    - Performance is the field-share-weighted mean of per-cell posterior means, including
      structural 50% mirrors; floor is the minimum posterior mean across non-mirror
      current-field opponents.
    - The performance interval and all-opponent minimum-floor interval use seeded
      posterior draws; the visible floor range is the named toughest pairing's cell
      interval, while the all-opponent minimum interval remains available in evidence
      details.
    - Performance and floor have independent leaders. The floor leader maximizes the
      floor among eligible rows, with performance breaking floor ties; both are independent
      table sorts, and Pareto rows show the efficient frontier.
    - Every valid cell contributes an estimate. Prior-only and uncertain cells remain
      visible with W-L/n, interval, prior strength, prior provenance, source kind,
      and source window; prior-only rows are not recommendation candidates.
    - The current field uses a provisional 28-day exponential half-life over the observed
      ban-regime slice. The denominator is published deck lists, not a census of entrants.
      Integer observed counts, decay-weighted counts, effective sample size, and bounded
      transition prior counts remain separate.
    - Clean interval evidence may override a cell once. The override keeps the actual
      MatchupCell prior_strength and its interval/source provenance; it is not pooled
      again with overlapping fallback evidence.
    - The mature positioning estimator and future-only benchmark remain frozen reference
      surfaces. Their outputs do not validate or promote this current descriptive
      projection.
    - scripts/evaluate_deck_rankings.py retains its retrospective field diagnostic.
      Separate --served-model phases seal all six predictions before development scoring
      and require a sealed development selection before confirmation outcomes open;
      no phase publishes a method.
    - The generated page is disposable. Edit the tracked script or template, then
      regenerate decks/deck-rankings.html; do not hand-edit the output.
  docs/analysis/meta-deck-analysis-loop.md:
    summary: 'Codifies the five-stage meta-deck analysis loop proven on Dimir Tempo
      + Doomsday Tempo

      (2026-07-04) into a repeatable per-archetype procedure, and specifies the knowledge
      feed

      it produces for the simulation engine / synthetic data generator (epic-goldfish-simulation

      input spec, not implementation).

      '
    decisions:
    - 'The loop is per-archetype and composable: any meta archetype runs stages 1-4
      with the same shipped surfaces (consensus → boards A/B → per-meta variants →
      comparison); stage order is fixed, stages are skippable only with a stated reason.'
    - 'Two boards always: A unconstrained (acquisition targets fall out for free),
      B owned-constrained (catalog-filter + labeled repairs — never presented as a
      native solver mode).'
    - Sweep-confirmed overrides (Defense Grid, Damping Sphere) apply mechanically
      to every board until the scorer mechanisms are fixed; every override and refill
      is labeled in the deck file header.
    - Venue divergence is first-class output — per-meta verdicts are never blended;
      each verdict ships with its composition trigger (what field drift would flip
      it).
    - Subarchetype splits are conservative marker rules persisted to decks.variant;
      neither/both residue stays unlabeled; camp n and tier are stated on every downstream
      claim.
    - Engine-raw reference lists keep known scorer biases VISIBLE (e.g. pitch-counter
      1-ofs) so before/after remains measurable; only the pilot's personal board gets
      judgment fills.
    - 'The loop''s outputs are the simulation feed: nothing new is computed for the
      sim engine — it consumes what the loop already produces.'
  docs/VISION.md:
    summary: 'legacy-engine is a Magic: The Gathering Legacy-format analytics platform
      — sibling to edh-engine

      (cEDH). It answers "what''s the meta, how do I attack it, and how do I tune
      my deck?" via three

      reinforcing data layers (observed tournament data, synthetic goldfish simulation,
      generated insight)

      powering four analytical pillars: Meta & Performance, Deck Mechanics, Deck Generation,
      and Meta Attack/Advisory.

      '
    decisions:
    - 'Four analytical pillars — Meta & Performance, Deck Mechanics (goldfish), Deck
      Generation, and Meta Attack/Advisory (the Legacy-specific differentiator: matchup
      positioning, sideboard recommender, what-to-play).'
    - 'Sibling-of-edh-engine: reuse its 3-data-layer → pillar architecture, deck-as-data
      model, goldfish/mana/mulligan engines wherever the domain overlaps; diverge
      only where Legacy demands it.'
    - 'Key architectural delta: an explicit archetype-parser layer (no commander to
      key on) — labels decklists into the community taxonomy.'
    - Current shipped arc = ingestion + meta analytics + advisory + deck generation
      (consensus, field tuning, export, gap discovery, and deck doctor); goldfish
      simulation and goldfish-validated candidate evaluation remain deferred Deck
      Mechanics work.
    - Legacy is a 1v1, best-of-3, 60-card-with-sideboard format — sideboarding and
      matchups are first-class, unlike edh-engine's 4-player goldfish framing.
    - Banned-list legality is a live blacklist (changes ~quarterly) and must be version-stamped
      by date for historical analysis.
    - 'Per-entity stable eras: every per-archetype/per-camp statistic uses the entity''s
      own detected and certified set of compatible time intervals, not just one global
      ban regime or monotone suffix; bans and releases nominate disturbances, confirmed
      affectedness remains a hard boundary, and every windowed figure names the admitted
      intervals and evidence provenance.'
    - 'Three-level taxonomy: superarchetype (data-driven strategy cluster over archetypes,
      curated overrides) → parent archetype → camp. Superarchetypes support internal
      context and strategic-plan navigation; the Deck Rankings page makes performance
      and worst-matchup floor equally visible while the mature Agency/P(best) projection
      and benchmark remain frozen reference surfaces.'
    - 'Deck Rankings is a current descriptive decision projection: full-field posterior
      mean performance and the minimum non-mirror posterior matchup mean are shown
      with intervals, provenance, and Pareto tradeoffs. Performance and floor have
      independent leaders, with performance breaking floor ties.'
    - 'Persistent-coach layer (cross-cutting): engine-generated knowledge — meta reads,
      per-deck findings, consensus decklists with primers — persists across sessions
      and is surfaced automatically; advice is grounded in a user profile (decks played,
      collection, local meta). maintainer-first now, multi-user-ready by design: the
      profile is data, not code.'
