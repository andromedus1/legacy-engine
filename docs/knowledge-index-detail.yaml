  docs/briefs/ingestion-archetype-contracts/fbettega-cache-schema.md:
    summary: 'Pins down the data contract for the fbettega tournament-data sources
      (fbettega/MTG_decklistcache +

      fbettega/mtg_decklist_scrapper), the Legacy analog to cEDH''s edhtop16. Every
      JSON file is a CacheItem

      with four parts — Tournament, Decks[], Rounds[], Standings[] — written by the
      scraper''s to_dict() methods

      in PascalCase keys; the real committed schema differs from the (stale) README
      example. Provenance

      (online MTGO vs paper Melee) is encoded by the source DIRECTORY and the Uri
      host, not a field. Card names

      are already normalized to Scryfall canonical forms by the scraper, which de-risks
      the card-data join.

      '
    key_findings:
    - 'Schema (verified against live files): each .json = CacheItem with PascalCase
      top-level keys Tournament, Decks, Rounds, Standings. Tournament = {Date, Name,
      Uri, Formats}; Deck = {Date, Player, Result, AnchorUri, Mainboard[], Sideboard[]}
      with cards as {Count, CardName}; Standing = {Rank, Player, Points, Wins, Losses,
      Draws, OMWP, GWP, OGWP}; RoundItem = {Player1, Player2, Result}.'
    - The README's JSON example (lowercase keys, Formats as a list) is STALE/illustrative
      — real files use PascalCase and Formats is a bare string 'Legacy' (the Python
      model types it List[str] but to_dict emits the raw value). Build the parser
      against the to_dict() output, not the README.
    - 'Layout: Tournaments/<Source>/<YYYY>/<MM>/<DD>/<slug>.json. Source dirs: MTGO,
      MTGmelee, Topdeck, CardsRealm, Manatrader (+ Tournaments-Archive for dead sources).
      Legacy events found via filename slug (legacy-challenge-32-…, legacy-showcase-challenge-…,
      legacy-league-…) AND Tournament.Formats==''Legacy''; paper-Melee slugs are free-text
      so filter on Formats, not the name.'
    - 'Provenance is NOT a field: online vs paper is the source directory (MTGO =
      online; MTGmelee/Topdeck/CardsRealm = mostly paper) plus the Uri host (mtgo.com
      vs melee.gg vs topdeck.gg). Player names corroborate (MTGO handles vs paper
      real names). The engine must derive a provenance label at ingest from dir+host.'
    - 'Leagues vs Challenges differ structurally: MTGO leagues are 5-0 dumps — Rounds=[]
      and Standings=[], Deck.Result is a record like ''5-0''. Challenges carry full
      Rounds (Quarterfinals…/Round N) + 32 Standings with tiebreakers, Deck.Result
      is ''1st Place''. Code MUST treat empty Rounds/Standings as normal, not an error.'
    - 'Card names are already Scryfall-canonical: the scraper''s CardNameNormalizer
      strips whitespace, removes the Alchemy ''A-'' prefix, and maps via a dict built
      at runtime from Scryfall (is:split/is:dfc/adventure/flip) plus a hardcoded MTGO/Melee
      mismatch table. Split cards use '' // '' (e.g. ''Dead // Gone''). This means
      a near-direct join to Scryfall, but it''s runtime-built (drifts), so keep a
      fallback fuzzy/unmatched bucket.'
    - 'Cadence: MTGO/Melee/Topdeck auto-update daily ~17:00 UTC (commits land ~18:32
      UTC); Manatraders ~Monday after the event. One automated commit/day (''Mise
      à jour automatique : YYYY-MM-DD''). MTGO.com data from 2024-06-20 onward is
      degraded (website change) and lives in a separate folder.'
    - 'Consumption: clone (cache is a git submodule of the scraper) or sparse-checkout
      Tournaments/MTGO + Tournaments/MTGmelee; git pull is the incremental signal.
      Detect new events by diffing the day-folder file list (scraper itself dedups
      via ''if os.path.exists(target_file): continue''). Raw GitHub (raw.githubusercontent.com/…/master/…)
      works per-file; GitHub contents API lists day folders.'
