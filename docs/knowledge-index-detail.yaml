  docs/briefs/ingestion-archetype-contracts/mtgoformatdata-rule-schema.md:
    summary: |
      The rule-as-data schema of Badaro/MTGOFormatData for Legacy: Name + IncludeColorInName + Conditions
      (AND-combined) + optional ordered Variants; 12 condition Types; fallback piles by ≥10% overlap;
      color naming lives in the consumer, not the rules. ~174 archetypes + 8 fallbacks; updated monthly.
    key_findings:
      - "A rule = JSON {Name, IncludeColorInName, Conditions[] (AND), optional Variants[]}; one archetype per file."
      - "12 condition Types: In{Mainboard,Sideboard,MainOrSideboard}, OneOrMore*/TwoOrMore* per zone, DoesNotContain*. Cards within a condition = OR."
      - "Variants require parent match first; DoesNotContain makes siblings mutually exclusive."
      - "Fallbacks (8 files) have CommonCards, no Conditions; used only when nothing matched, ≥10% overlap floor."
      - "Color/guild naming is the CONSUMER's job; repo supplies only IncludeColorInName + color_overrides.json."
      - "Legacy coverage ≈174 archetype files; taxonomy matches the community tier list."
      - "metas.json defines ~40 format eras; pin a commit SHA and diff Formats/Legacy/ between SHAs."
