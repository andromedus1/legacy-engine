  docs/PRINCIPLES.md:
    summary: 'Project-specific decision heuristics for legacy-engine. Inherits edh-engine''s
      analytics principles

      (analytics is the product, data-driven over vibes, rules-correct at the fidelity
      claimed, knowledge

      compiled not re-derived) and adds Legacy-specific ones: legality is live data,
      always label the

      meta-% definition and online/paper basis, uncertainty-qualify every stat, and
      treat the advisory layer

      as a first-class product.

      '
    decisions:
    - Analytics is the product — infrastructure is justified only by the analytical
      questions it unlocks.
    - Data-driven over vibes — every claim backed by tournament data, simulation,
      or both; build a pipeline wherever there's a data source.
    - Rules-correct at the fidelity claimed — the goldfish track simplifies transparently
      and carries confidence metadata; never wrong-but-fast.
    - Legality is live data — validate against a dated BanListSnapshot; the banned
      list changes ~quarterly and history must stay correct.
    - Never an unlabeled meta-% — always state the definition (raw/top-cut/winrate-weighted)
      and the online/paper/blend basis; they diverge materially.
    - Uncertainty qualifies strength and wording, not permission to speak — sample
      size, intervals, priors, and provenance accompany every estimate; low-n and
      prior-only values remain visible with honest labels.
    - Advisory is first-class — 'how to attack the field' is a headline product surface,
      not a footnote to descriptive stats.
    - Ban-regime-aware windowing is the default, and the window is always stated —
      adaptive for matrix-backed surfaces, uniform for explicit --regime/--since windows,
      full for deck-based descriptive surfaces; a thin window may never silently claim
      depth it doesn't have.
    related:
    - slug: docs/VISION.md
      relationship: depends-on
    - slug: docs/ARCHITECTURE.md
      relationship: parallel-to
