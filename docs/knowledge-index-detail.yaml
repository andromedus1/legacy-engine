      - "Goldfish clock anchor: Oops All Spells 66% T1 / 76% T2 / 83% T3 [cited]; combo T1-3, fair tempo/control T4-6+ (win by disruption/attrition)."
      - "Meta-speed = per-archetype clock PMF weighted by meta share; model goldfish (upper bound) AND effective (⊗ FoW/Daze) clocks; the gap is a format-health signal."
      - "Aggregators 403-block bots; meta-% computed differently per source; online/paper diverge — compute % yourself under multiple definitions and label the source."
      - "Universal constant: dedicated graveyard hate + free counters in every sideboard."

