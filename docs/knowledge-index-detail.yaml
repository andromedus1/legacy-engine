  docs/briefs/ingestion-archetype-contracts/ingestion-ops-and-metashare.md:
    summary: 'The data layer legacy-engine depends on is one community-maintained
      scrape (fbettega) sitting on top

      of an upstream (mtgo.com / Melee) that WotC actively destabilizes — Badaro''s
      predecessor cache died

      2025-06-10, MTGO has restricted decklist visibility since 2024-06-20, and a
      Feb-2026 visibility cut was

      rolled back days later. This brief specifies the operational contract: mirror
      both the fbettega cache and

      MTGOFormatData rules as versioned local inputs behind an `ingestion/` port so
      a replacement source swaps in

      without touching analytics; compute meta-% three labeled ways (raw entry count,
      top-cut presence,

      win-rate-weighted) because MTGO data is success-filtered and online/paper diverge;
      and — the load-bearing

      finding — the cache JSON includes a `Rounds` object with per-match pairings
      (`player1`/`player2`/`result`),

      so we CAN compute our own matchup matrix from raw rounds when present, with
      no dependence on the bot-blocked

      mtgdecks.net matrix.

      '
    key_findings:
    - 'Source layer is single-point-of-failure: fbettega is the live successor to
      Badaro''s MTGODecklistCache (archived 2025-06-10, reason ''mtgo.com scraper
      is no longer working''); it is one maintainer scraping an upstream WotC actively
      restricts.'
    - 'Upstream is hostile-by-policy, not just fragile: MTGO publishes only Top-32
      of scheduled events + a SELECTION of 5-0 league lists since 2024-06-20; a further
      Feb-2026 visibility cut was announced and ROLLED BACK within days (mtgo.com
      2026-02-20) — visibility is a live, mutable variable.'
    - 'LOAD-BEARING: the cache JSON carries a Rounds object (matches: player1, player2,
      result, id) AND Standings (rank, points, wins/losses/draws, omwp/gwp/ogwp).
      We CAN compute our own matchup matrix from raw rounds — no dependence on mtgdecks.net''s
      403-blocked matrix. BUT both are emitted ''when available''.'
    - 'Coverage is structurally bimodal: paper (Melee) and MTGO Challenges typically
      ship Rounds+Standings → matchups computable; MTGO 5-0 League dumps ship decklists
      only (no pairings, no standings) → contribute to raw-count meta-% but NOT to
      matchup cells or win-rate weighting.'
    - 'Meta-% has three non-comparable definitions: (a) raw entry share, (b) top-cut
      presence (success-filtered, inflates winners), (c) win-rate-weighted. Published
      MTGO data is itself success-filtered, so naive raw-count over a challenge-only
      corpus already double-counts success. MTGGoldfish uses a 5%-inclusion floor
      by design.'
    - 'Online and paper diverge materially (online: cheap tuned tempo; paper: dual-heavy
      diverse). Derive the split from the cache Tournament name/uri/source field;
      LABEL each separately and offer a weighted blend — never emit an unlabeled blended
      number (PRINCIPLES #6).'
    - 'Resilience plan: vendor both repos as pinned git submodules/snapshots under
      data/upstream/ with a captured commit SHA + fetch date; analytics reads only
      the local mirror; a staleness health-check flags upstream dead if newest tournament
      date or repo HEAD age exceeds a threshold.'
    - 'Confidence-gate everything (PRINCIPLES #7): archetypes <2% share and matchup
      cells n<100 are flagged, not silently shown; attach edh-engine''s established/evolving/speculative
      tier as metadata on every emitted stat.'
