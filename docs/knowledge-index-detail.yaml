  docs/briefs/deck-generation-and-moxfield.md:
    summary: 'Unblocks the deferred deck-generation pillar. Two halves: (1) the Moxfield
      integration path — there is

      NO official public API, the unofficial endpoints are Cloudflare-gated and ToS-restricted,
      so the engine

      should treat Moxfield as an EXPORT target (emit importable decklist text / deep
      links) rather than push

      programmatically; sanctioned read access is via support@moxfield.com for a custom
      User-Agent. (2) A

      deck-generation/tuning approach that consumes the already-built meta-share,
      matchup matrix, positioning

      score, and sideboard recommender — consensus-baseline → field-tuning → gap discovery
      — gated on first

      fixing the advisory heuristic limitations surfaced by real-data use this session.

      '
    key_findings:
    - Moxfield has NO official public/write API. Unofficial api2.moxfield.com (v2/v3)
      is Cloudflare-protected and reverse-engineered; community libraries (cloudscraper-based)
      are read-only. Scraping violates Moxfield ToS; the sanctioned path for tools
      is emailing support@moxfield.com to register a custom User-Agent (read access).
    - 'Programmatic deck CREATE/UPDATE requires an authenticated user session (bearer
      + Cloudflare) and is undocumented + ToS-gray + fragile. Do NOT build a native
      push for MVP. Treat Moxfield as an export sink: emit standard importable decklist
      text and/or a prefilled deep link the user pastes/imports.'
    - Moxfield import format is the MTG-standard '<qty> <Card Name> [(SET) collector#]'
      one per line, with a 'Sideboard' section header. The engine's consensus lists
      already import as-is — no format work needed for export.
    - 'Deck generation should consume existing layers, not reinvent: positioning S(D)/Ū
      rank candidate shells; the matchup matrix tunes the maindeck against the field;
      the sideboard recommender builds the 15; the version-stamped ban list validates
      legality (banlist.validate_deck).'
    - 'Three generation modes: (a) consensus baseline (modal cards per archetype —
      already prototyped), (b) field-tuning (optimize a shell''s 60+15 against the
      current/projected field), (c) gap discovery (shells with high positioning S
      but low field share, or cards over-performing on win-rate yet under-played).'
    - 'HARD PREREQUISITE: the advisory heuristic gaps found via real-data use (proactivity
      mis-rating creature-tempo, P(best) thin-data bias, sideboard binary-coverage
      budget under-fill, vulnerability-tag presence inflation) must be fixed first
      — a generator built on them inherits and amplifies the errors. Deck-gen depends_on
      those improvement items.'
    - Goldfish-simulation (speed/consistency/mulligan) is a SEPARATE deferred pillar;
      a mature generator should goldfish-validate candidates, but that integration
      is out of this brief's scope.
  docs/briefs/deck-viz-platform.md:
    summary: 'Integration brief that unblocks epic-deck-viz-platform. Harvests ds-engine''s
      locked viz research

      (Vega-Lite + vl-convert + strip-and-inject theming + 12-col tiles) and resolves
      the four

      legacy-engine-specific questions: vl-convert-python is the single render dependency
      (it does BOTH

      static PNG and self-contained HTML); specs are authored as hand-built Python
      dicts (not Altair);

      the five dashboard tiles bind to named analytics/advisory/generation functions
      whose shapes are

      documented here; and charts.py migrates by keeping its pure `_*_model` prep
      layer and swapping the

      matplotlib renderers for Vega-Lite spec builders.

      '
    key_findings:
    - 'vl-convert-python (1.9.x, zero-dependency abi3 wheel, macOS-arm64 + linux wheels)
      is the SINGLE render dependency: vegalite_to_png(spec, scale=) for static PNG
      AND vegalite_to_html(spec, bundle=True) for self-contained interactive HTML.
      No Chrome, no Node, no browser. PNG is deterministic same-machine.'
    - Author specs as hand-built Vega-Lite v6 dicts, NOT Altair. Small fixed chart
      vocabulary (~5 marks), we already depend on vl-convert (which takes dicts),
      tight theme control, trivial JSON snapshot tests. Altair would add jinja2+jsonschema+narwhals
      for no benefit.
    - We author every spec ourselves, so ds-engine's runtime AJV validator + correction-loop
      are NOT needed. Validation is a TEST-TIME concern (jsonschema.validate against
      the VL v6 schema + JSON snapshot fixtures). This trims the epic's 'structural
      validator' scope substantially.
    - 'Strip-and-inject is still mandatory (vega-embed #27): strip top-level spec.config,
      then bake the canonical theme dict into spec.config before BOTH render paths
      so HTML and PNG match. Two theme variants (screen vs print) sharing palette/fonts.'
    - charts.py already splits pure honesty-logic prep (_heatmap_model/_metashare_model/_tier_model/_trends_model
      — matplotlib-free dataclasses) from matplotlib render_* . Migration KEEPS the
      prep models, writes spec_from_*(model) Vega-Lite builders, and drops the matplotlib
      renderers + the matplotlib dependency.
    - 'Per-deck dashboard tiles bind to: metashare.compute_metashare→MetaShareReport;
      matchup.build_adaptive_matrix→AdaptiveMatrix (the deck''s ROW as a win% bar,
      not the full NxN); trends.compute_trends→TrendSeries; positioning.rank_decks→DeckRanking
      (highlight subject deck); generation/consensus.build_consensus→GeneratedDeck
      (HTML card-list tile, not a chart). No ''primer'' function exists — the composed
      page IS the primer.'
  docs/briefs/ingestion-archetype-contracts/archetype-matching-algorithm.md:
    summary: 'Reverse-engineers the CLASSIFY stage: the archived Badaro/MTGOArchetypeParser
      C# engine that

      consumes MTGOFormatData rules + a decklist and emits an archetype label. The
      core is a single

      static method, ArchetypeAnalyzer.Detect, that AND-tests every specific archetype''s
      conditions,

      collects ALL matches (no tie-break by default — it emits a "Conflict(...)" label),
      nests variant

      resolution inside the matched parent, falls back to a most-shared-cards "generic/fallback"
      pile

      with a 10% similarity floor, and computes colors from the intersection of land-color
      and

      nonland-color evidence. Card matching is exact case-sensitive string equality
      on MTGO CardName.

      Includes Python-ready pseudocode and the full input/output contract.

      '
    key_findings:
    - Core is one method — ArchetypeAnalyzer.Detect(mainboard, sideboard, format,
      minSimilarity=0.1, conflictMode=None). It tests EVERY specific archetype; a
      rule matches only if ALL its conditions pass (logical AND over conditions, short-circuit
      on first failure). All matches are collected, not just the first.
    - 'There is NO built-in tie-break by default (ConflictSolvingMode.None): if 2+
      archetypes match, the App emits the literal string Conflict(NameA,NameB). Only
      with PreferSimpler does it pick the match with the FEWEST conditions (GetComplexity
      = Conditions.Length, archetype + variant summed). ''Specificity'' = condition
      count, lower wins under PreferSimpler.'
    - 'Variants are nested: a variant is only tested if its parent archetype already
      matched (variant conditions are an ADDITIONAL AND-block). Every passing variant
      produces its own ArchetypeMatch; if none pass, the bare parent matches. A parent
      with N passing variants yields N matches (a conflict).'
    - Fallback only fires when zero specific archetypes match. It scores each Generic/Fallback
      by SUM of Count of distinct deck cards present in its CommonCards, picks max
      (ties broken by SHORTEST CommonCards list), and accepts only if similarity (max_weight
      / total_card_count) > minSimilarity (0.1). Otherwise the App labels the deck
      'Unknown'.
    - 'Colors are computed by intersection of two independent tallies: a color is
      included ONLY IF it appears in at least one LAND (per Lands map) AND at least
      one NONLAND (per NonLands map), across main+sideboard. Result is a fixed ArchetypeColor
      enum (C, mono, guild, shard/wedge, 4c, WUBRG). Cards absent from both maps contribute
      nothing.'
    - Card-name matching is exact, case-sensitive C# string equality (c.Name == rule
      card). No normalization, no fuzzy match, no split/DFC/adventure '//' handling
      in the engine — names must already be in MTGO canonical form upstream. This
      is a hard contract on the INGEST/CARD-CONTRACT boundary, not the algorithm.
    - 'Companion is detected separately (sideboard-only scan against a hardcoded 10-card
      map) and returned alongside, NOT folded into archetype matching. Empty/partial
      lists do not crash: empty mainboard/sideboard arrays simply fail membership
      tests → typically Unknown.'
    - 'Output contract: ArchetypeResult { Matches[], Color, Companion? }; the App
      flattens to RecordArchetype { Archetype:string, Color:string, Companion:string
      } where Archetype is the variant name if a variant matched, else the parent
      name, color-prefixed iff IncludeColorInName, PascalCase split into words.'
