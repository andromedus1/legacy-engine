  docs/briefs/ingestion-archetype-contracts/csharp-python-port-strategy.md:
    summary: 'Recommends vendoring MTGOFormatData (the archetype rules-as-JSON) as
      a versioned, pinned data

      dependency synced via a git subtree/submodule + a `refresh` CLI step, while
      reimplementing ONLY

      MTGOArchetypeParser''s matching engine (~11 condition types, archetype→variant→fallback
      order,

      color_overrides) as a pure Python function in `archetype/`. The C# parser was
      archived 2025-09-24,

      so the matcher spec is a frozen, ~600-line target — ideal to port once and lock
      with golden tests.

      Fidelity is the dominant risk: a golden harness replays the archived C# parser''s
      published JSON

      labels over a fixed corpus of fbettega/MTGODecklistCache tournaments and asserts
      ≥99% label

      agreement as a CI gate. Drift in the JSON data (new archetypes/condition types,
      monthly Legacy

      updates) is handled fail-fast — an unknown condition Type raises, mirroring
      edh-engine''s

      fail-fast-on-unknown-role convention.

      '
    key_findings:
    - 'HEADLINE: vendor the JSON rules as a pinned data dependency + reimplement ONLY
      the matcher in Python. Do NOT shell out to the C# binary, do NOT .NET-interop,
      do NOT rewrite the rule data. The data is the asset; the matcher is ~600 lines
      of frozen, well-understood logic.'
    - 'The C# MTGOArchetypeParser was ARCHIVED 2025-09-24 (.NET 8). A frozen reference
      implementation is the best possible port target: the spec stops moving, so a
      one-time port + golden lock is durable. The companion DATA (MTGOFormatData)
      keeps changing — that''s exactly what we vendor and sync, not reimplement.'
    - 'Matcher scope is small and bounded: ~11 condition Types (InMainboard, InSideboard,
      InMainOrSideboard, plus OneOrMore/TwoOrMore × M/S/M-or-S, DoesNotContain), match
      order archetype→variant→fallback-by-card-overlap (≥10% threshold), color from
      decklist + color_overrides.json, IncludeColorInName naming.'
    - 'Vendor mechanism: git subtree (preferred) of the upstream rules repo into `data/archetype_rules/`,
      pinned to a commit SHA recorded in a manifest; a `legacy refresh rules` CLI
      command pulls upstream, diffs, and surfaces new archetypes/condition-types BEFORE
      they reach the matcher. Submodule is the fallback; fetch-on-build is rejected
      (non-deterministic, violates ''no runtime network calls'').'
    - 'Fidelity gate: golden test replays the archived C# parser''s own published
      `mtgo_data_*.json` label outputs over a frozen tournament corpus from fbettega/MTGODecklistCache;
      assert per-deck label agreement ≥99% (target 100% on the locked rules SHA);
      CI fails below threshold. Disagreements are triaged as port bugs, never silently
      accepted.'
    - 'Drift handling is fail-fast, sibling-consistent: an unknown condition `Type`
      in vendored JSON raises `UnknownConditionTypeError` at load time (not at match
      time, not a silent skip) — mirrors edh-engine''s fail-fast-on-unknown-role.
      New archetypes need no code change (data-driven); new condition Types need a
      matcher addition + a golden re-lock.'
    - 'Effort estimate: ~3–5 focused days. Matcher port + Pydantic models (~1.5d),
      vendor/subtree + refresh CLI + manifest (~1d), golden harness + corpus capture
      + CI gate (~1.5d). Top risks: (1) silent label divergence from subtle C# semantics,
      (2) upstream data-schema drift after archival, (3) color-detection edge cases
      (color_overrides + lands).'
