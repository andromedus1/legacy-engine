      relationship: depends-on
  docs/briefs/ingestion-archetype-contracts/campaign.md:
    summary: 'Campaign report for the 7-specialist deep-research run on legacy-engine''s
      ingestion + archetype-parser

      data contracts. Evaluator scored it 4/5 overall ("an unusually buildable brief
      set"): coverage 5,

      coherence 5, contradictions 4, groundedness 4, recommendations 4. Captures the
      flagged contradictions

      (notably the Scryfall-library reuse verdict and an unreconciled ~210-vs-600
      LOC figure) and the

      must-verify-before-building list (golden-test oracle availability, the library
      ADR, the guild table).

      '
    key_findings:
    - Overall 4/5 — buildable now; an engineer could design ingestion/ and archetype/
      and start the port from these briefs alone.
    - 'Two genuine contradictions: (1) CARD-CONTRACT ''extend edh-engine scryfall.py''
      vs PRIOR-ART ''adopt Scrython/mtg_parser'' (flagged by synthesis); (2) matcher
      cited as ~210 LOC (CLASSIFY) vs ~600 LOC (PORT) — NOT flagged by synthesis,
      caught by the evaluator.'
    - 'Riskiest unverified assumption: the golden-test fidelity gate assumes the archived
      C# parser''s labels are obtainable — confirm before committing to ≥99% agreement
      as the primary risk control.'
    - Groundedness is high where it matters — CLASSIFY cites C# file:line, CARD-CONTRACT's
      reuse verdict was independently verified against real edh-engine source by the
      evaluator.
