[project]
name = "legacy-engine"
version = "0.1.0"
description = "Analytics platform for the Magic: The Gathering Legacy format"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pulp>=2.8",
    "vl-convert-python>=1.9,<2",
    "ijson>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
legacy-engine = "legacy_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PuLP 3.3.2 emits PuLP-4.0 migration DeprecationWarnings from our current-API usage
    # (LpVariable(...) constructor, PULP_CBC_CMD); the 4.0 replacements don't exist in 3.3.2.
    # Silence the noise so real warnings stay visible; migrate when PuLP 4.0 lands.
    "ignore:Constructing LpVariable.*:DeprecationWarning",
    "ignore:PULP_CBC_CMD is deprecated.*:DeprecationWarning",
]
